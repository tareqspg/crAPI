# ============================================================================
# crapi.conf – OWASP crAPI API Gateway configuration
# ----------------------------------------------------------------------------
# Acts as an API Gateway for the OWASP crAPI demo app.
# Includes:
#   - Central reverse proxy and routing
#   - CORS handling
#   - Security headers
#   - Rate limiting per client IP
#   - Regex-based endpoint routing (per OpenAPI spec)
#   - JSON-aware logging
#   - Integrated proxy_params (so file is self-contained)
# ============================================================================

# ------------------------
# Rate limiting (per IP)
# ------------------------
limit_req_zone $binary_remote_addr zone=crapi_ip:10m rate=5r/s;
limit_req_status 429;
# ------------------------
# Upstream backend cluster
# ------------------------
upstream crapi_backend {
    zone crapi_backend 64k;
    server 10.1.20.22:30080;
    keepalive 32;
}

# ----------------------------------
# Logging format (structured JSON)
# ----------------------------------
log_format json_combined escape=json
    '{'
    '"time_local":"$time_local",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"host":"$host",'
    '"upstream_addr":"$upstream_addr",'
    '"user_agent":"$http_user_agent"'
    '}';

# ------------------------
# Main server block
# ------------------------
server {
    listen 8888 default_server;
    server_name crapi.local 10.1.20.22;
    status_zone crapi_server_zone;   # For NGINX Plus live activity monitoring

    limit_req zone=crapi_ip burst=5 nodelay;
    
    access_log /var/log/nginx/crapi_access.log json_combined;
    error_log  /var/log/nginx/crapi_error.log warn;


    # ------------------------
    # CORS configuration 
    # ------------------------
    location / {
    # Handle preflight requests
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            return 204;
        }

        # For all other requests
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://crapi_backend;
    }
    
    # ------------------------
    # Security headers
    # ------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;


    # ------------------------
    # Proxy common parameters
    # (merged from proxy_params)
    # ------------------------
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 50M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # ============================================================================
    # Specific endpoint routing (based on OpenAPI spec)
    # ============================================================================

    # --- Identity APIs ---
    location = /identity/api/auth/signup {
        limit_req zone=crapi_ip burst=5 nodelay;
        proxy_pass http://crapi_backend;
    }

    location = /identity/api/auth/login {
        limit_req zone=crapi_ip burst=5 nodelay;
        proxy_pass http://crapi_backend;
    }

    location = /identity/api/auth/logout {
        limit_req zone=crapi_ip burst=20 nodelay;
        proxy_pass http://crapi_backend;
    }

    location ~* ^/identity/api/v2/user/(videos|details|profile).* {
        proxy_pass http://crapi_backend;
    }

    # --- Community / Coupon APIs ---
    location ~* ^/community/api/v2/(coupon|posts|comments).* {
        proxy_pass http://crapi_backend;
    }

    # --- Vehicle APIs ---
    location ~* ^/vehicle/api/(register|vehicles|details|update|delete).* {
        proxy_pass http://crapi_backend;
    }

    # --- Mechanic / Workshop APIs ---
    location ~* ^/(mechanic|workshop)/api/.* {
        proxy_pass http://crapi_backend;
    }

    # --- Video content ---
    location ~* ^/videos/.* {
        proxy_pass http://crapi_backend;
    }

    # --- Misc endpoints (notifications, health, etc.) ---
    location ~* ^/(notifications|health|status)/.* {
        proxy_pass http://crapi_backend;
    }

    # ============================================================================
    # Default API catch-all and fallback
    # ============================================================================
    location ~* ^/api/.* {
        proxy_pass http://crapi_backend;
    }

    # Catch-all fallback for any other unhandled path
    #location / {
    #    proxy_pass http://crapi_backend;
    #}

    # ============================================================================
    # Error handling pages
    # ============================================================================
    error_page 400 401 403 404 /custom_4xx.html;
    location = /custom_4xx.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /custom_5xx.html;
    location = /custom_5xx.html {
        root /usr/share/nginx/html;
        internal;
    }
}
