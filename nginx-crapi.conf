# crapi.conf – OWASP crAPI specific API proxy

upstream crapi_backend {
    server 127.0.0.1:8888;
}

server {
    listen 8080;
    server_name crapi.local;

    access_log  /var/log/nginx/crapi_access.log;
    error_log   /var/log/nginx/crapi_error.log;

    # CORS for all paths
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept' always;
    if ($request_method = OPTIONS) {
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=crapi_ip:10m rate=5r/s;
    limit_req zone=crapi_ip burst=20 nodelay;

    # Route API endpoints based on OpenAPI spec :contentReference[oaicite:1]{index=1}
    location = /identity/api/auth/signup {
        proxy_pass http://crapi_backend;
        include proxy_params;
    }

    location = /identity/api/auth/login {
        proxy_pass http://crapi_backend;
        include proxy_params;
    }

    # Additional endpoints per spec: vehicle, video, coupon, mechanic, etc.
    location ~* ^/(identity/api/v2/user/videos/.*) {
        proxy_pass http://crapi_backend;
        include proxy_params;
    }

    location ~* ^/community/api/v2/coupon/validate-coupon {
        proxy_pass http://crapi_backend;
        include proxy_params;
    }

    location ~* ^/vehicle/api/.* {
        proxy_pass http://crapi_backend;
        include proxy_params;
    }

    location ~* ^/mechanic/api/.* {
        proxy_pass http://crapi_backend;
        include proxy_params;
    }

    # Fallback proxy for any other /api/ paths
    location / {
        proxy_pass http://crapi_backend;
        include proxy_params;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# Common proxy settings
# You can place this in proxy_params file or duplicate
